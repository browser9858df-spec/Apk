<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">
<title>Sohbet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #0f172a; color: #fff; position: fixed; overscroll-behavior: none; }

  #loginScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 30px;
  }
  #loginScreen h1 {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; font-size: 52px; font-weight: 800;
    letter-spacing: -2px; margin-bottom: 5px;
  }
  #loginScreen p { opacity: 0.5; font-size: 14px; margin-bottom: 25px; }
  #loginScreen input {
    width: 100%; max-width: 320px; padding: 16px; border-radius: 14px;
    border: 2px solid #334155; background: #1e293b; color: #fff;
    outline: none; font-size: 16px; transition: border-color 0.2s;
  }
  #loginScreen input:focus { border-color: #6366f1; }
  #loginScreen input::placeholder { color: #64748b; }
  #loginScreen button {
    width: 100%; max-width: 320px; padding: 16px; border-radius: 14px;
    border: none; background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
    margin-top: 10px; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
  }
  #loginScreen button:active { transform: scale(0.97); }

  #app { display: flex; flex-direction: column; height: 100%; width: 100%; }

  .header {
    background: linear-gradient(135deg, #6366f1, #a855f7);
    padding: 14px 16px; padding-top: max(14px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3); flex-shrink: 0; z-index: 10;
  }
  .header .title { font-size: 18px; font-weight: 800; }
  .header .right { display: flex; align-items: center; gap: 6px; }
  .header .room {
    font-size: 12px; background: rgba(255,255,255,0.22);
    padding: 5px 12px; border-radius: 14px; font-weight: 600;
    max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .notifBtn {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 14px; padding: 5px 9px; border-radius: 14px;
    cursor: pointer; font-weight: 600;
  }
  .notifBtn.active { background: #22c55e; }

  #chatMessages {
    flex: 1; overflow-y: auto; padding: 15px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  #chatMessages::-webkit-scrollbar { width: 4px; }
  #chatMessages::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  .msg {
    padding: 10px 14px; border-radius: 16px; max-width: 78%;
    word-wrap: break-word; word-break: break-word;
    font-size: 15px; line-height: 1.4; animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.me {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    align-self: flex-end; border-bottom-right-radius: 4px;
  }
  .msg.other {
    background: #1e293b; align-self: flex-start;
    border-bottom-left-radius: 4px; border: 1px solid #334155;
  }
  .msg .name { font-size: 11px; opacity: 0.75; display: block; margin-bottom: 3px; font-weight: 700; }
  .msg .time { font-size: 10px; opacity: 0.55; display: block; margin-top: 4px; text-align: right; }

  .empty { text-align: center; opacity: 0.4; font-size: 14px; margin-top: 60px; padding: 0 30px; line-height: 1.6; }

  #typingIndicator {
    display: none; align-items: center; gap: 8px;
    padding: 6px 14px; font-size: 13px; color: #94a3b8;
    font-style: italic; min-height: 28px; flex-shrink: 0;
  }
  #typingIndicator.show { display: flex; }
  #typingIndicator .typingName { color: #a855f7; font-weight: 600; font-style: normal; }
  .typingDots { display: inline-flex; gap: 3px; align-items: center; }
  .typingDots span {
    width: 5px; height: 5px; background: #a855f7; border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typingDots span:nth-child(2) { animation-delay: 0.2s; }
  .typingDots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }

  .inputArea {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: #1e293b; border-top: 1px solid #334155; flex-shrink: 0;
  }
  .inputArea input {
    flex: 1; padding: 13px 18px; border-radius: 24px; border: none;
    background: #0f172a; color: #fff; outline: none; font-size: 15px; min-width: 0;
  }
  .inputArea input::placeholder { color: #64748b; }
  .inputArea button {
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff;
    font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .inputArea button:active { transform: scale(0.88); }

  .hidden { display: none !important; }

  #connStatus {
    position: fixed; top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #ef4444; padding: 7px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 600; z-index: 50; opacity: 0;
    pointer-events: none; transition: opacity 0.3s, transform 0.3s;
  }
  #connStatus.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #loading {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
    z-index: 200; display: flex; align-items: center; justify-content: center;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid #334155;
    border-top-color: #6366f1; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 13px; font-weight: 600; z-index: 150;
    box-shadow: 0 4px 20px rgba(99,102,241,0.5);
    opacity: 0; pointer-events: none; transition: 0.3s;
    max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="loginScreen">
  <h1>Sohbet</h1>
  <p>Basit ve Hızlı Mesajlaşma</p>
  <input id="nameInput" type="text" placeholder="Adını gir..." maxlength="20" autocomplete="off" />
  <input id="roomInput" type="text" placeholder="Oda kodu" value="genel" maxlength="20" autocomplete="off" />
  <button onclick="login()">Sohbete Başla</button>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div class="title">💬 Sohbet</div>
    <div class="right">
      <div class="room" id="roomLabel">genel</div>
      <button class="notifBtn" id="notifBtn" onclick="toggleNotifications()" title="Bildirimler">🔕</button>
    </div>
  </div>
  <div id="chatMessages">
    <div class="empty">Henüz mesaj yok.<br>İlk mesajı sen yaz! 👋</div>
  </div>
  <div id="typingIndicator">
    <span class="typingName" id="typingName">—</span> yazıyor
    <span class="typingDots"><span></span><span></span><span></span></span>
  </div>
  <div class="inputArea">
    <input id="msgInput" type="text" placeholder="Mesaj yaz..." autocomplete="off" />
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<div id="connStatus">Bağlantı kesildi</div>
<div id="loading" class="hidden"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>

<script>
/* ============================================================
   FIREBASE AYARLARIN
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyC6fD-n8yg34wGBt-NCAV8ygtgOYTSJQNo",
  authDomain: "sohbet-47d78.firebaseapp.com",
  databaseURL: "https://sohbet-47d78-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sohbet-47d78",
  storageBucket: "sohbet-47d78.firebasestorage.app",
  messagingSenderId: "1042889609071",
  appId: "1:1042889609071:web:49e7cbe3d2e3abd2d7e29a",
  measurementId: "G-LGN9JTBKMJ"
};

/* VAPID ANAHTARIN */
const VAPID_KEY = "BJ4A2cLzrdkt4G22XiCp5uda-A_mA8Q-UPw9Gwj2UL5CTD8oiRY0yRcaW5yuUoYEFX5w6lKbnfjLgkEDp3eG2Fs";

let db = null;
let messaging = null;
let userName = "";
let roomId = "genel";
let userId = "u" + Date.now() + Math.random().toString(36).substr(2, 5);
let chatRef = null;
let typingRef = null;
let firstLoad = true;
let notifEnabled = false;
let appVisible = true;
let lastMsgTs = Date.now();
let typingTimer = null;
let isCurrentlyTyping = false;
let fcmToken = null;

/* ---------- SAYFA GÖRÜNÜRLÜĞÜ ---------- */
document.addEventListener('visibilitychange', () => {
  appVisible = !document.hidden;
  if (appVisible) document.title = "Sohbet";
});

/* ---------- GİRİŞ ---------- */
function login() {
  const nameInput = document.getElementById('nameInput');
  const roomInput = document.getElementById('roomInput');

  const n = nameInput.value.trim();
  const r = roomInput.value.trim();

  if (!n) { alert("Lütfen adını gir!"); nameInput.focus(); return; }
  if (n.length < 2) { alert("Adın en az 2 karakter olmalı!"); nameInput.focus(); return; }

  userName = n;
  roomId = r || "genel";

  showLoading();

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    // FCM başlat (destekliyorsa)
    if (firebase.messaging.isSupported && firebase.messaging.isSupported()) {
      messaging = firebase.messaging();
    }
  } catch (e) {
    hideLoading();
    alert("Firebase bağlantı hatası!\n\n" + e.message);
    return;
  }

  document.getElementById('roomLabel').textContent = roomId;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  initNotifications();
  initChat();
  initTyping();

  setTimeout(() => {
    hideLoading();
    document.getElementById('msgInput').focus();
  }, 600);
}

/* ============================================================
   SOHBET
   ============================================================ */
function initChat() {
  chatRef = db.ref("rooms/" + roomId + "/messages");

  chatRef.limitToLast(100).on("child_added", snapshot => {
    const m = snapshot.val();
    if (!m || !m.text) return;

    const isMe = (m.uid === userId);
    addMessage(m.name, m.text, m.ts, isMe ? "me" : "other");

    if (!isMe && m.ts && m.ts > lastMsgTs) {
      notifyNewMessage(m.name, m.text);
    }
    if (m.ts && m.ts > lastMsgTs) lastMsgTs = m.ts;
  }, error => {
    showConnStatus("Hata: " + error.message);
  });

  db.ref(".info/connected").on("value", snap => {
    if (snap.val() === true) hideConnStatus();
    else showConnStatus("Bağlantı kesildi");
  });
}

/* ---------- MESAJ GÖNDER ---------- */
function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();

  if (!text) return;
  if (!db || !chatRef) { alert("Bağlantı yok!"); return; }

  input.value = "";
  input.focus();
  stopTyping();

  chatRef.push({
    uid: userId,
    name: userName,
    text: text,
    ts: Date.now()
  }).catch(err => alert("Mesaj gönderilemedi: " + err.message));
}

/* ============================================================
   YAZIYOR GÖSTERGESİ
   ============================================================ */
function initTyping() {
  const msgInput = document.getElementById('msgInput');

  msgInput.addEventListener('input', () => {
    if (!isCurrentlyTyping) startTyping();
    clearTimeout(typingTimer);
    typingTimer = setTimeout(stopTyping, 1000);
  });

  typingRef = db.ref("rooms/" + roomId + "/typing");
  typingRef.on("value", snap => {
    const data = snap.val();
    if (!data) { hideTyping(); return; }

    const typers = Object.entries(data)
      .filter(([uid, info]) => uid !== userId && info && info.name)
      .map(([uid, info]) => info.name);

    if (typers.length === 0) hideTyping();
    else if (typers.length === 1) showTyping(typers[0]);
    else if (typers.length === 2) showTyping(typers[0] + " ve " + typers[1]);
    else showTyping(typers.length + " kişi");
  });
}

function startTyping() {
  if (!typingRef) return;
  isCurrentlyTyping = true;
  const ref = db.ref("rooms/" + roomId + "/typing/" + userId);
  ref.onDisconnect().remove();
  ref.set({ name: userName, ts: Date.now() });
}

function stopTyping() {
  if (!typingRef) return;
  isCurrentlyTyping = false;
  clearTimeout(typingTimer);
  db.ref("rooms/" + roomId + "/typing/" + userId).remove();
}

function showTyping(name) {
  document.getElementById('typingName').textContent = name;
  document.getElementById('typingIndicator').classList.add('show');
}

function hideTyping() {
  document.getElementById('typingIndicator').classList.remove('show');
}

/* ---------- MESAJ EKLE ---------- */
function addMessage(name, text, ts, cls) {
  const box = document.getElementById('chatMessages');
  if (firstLoad) { box.innerHTML = ""; firstLoad = false; }

  const div = document.createElement('div');
  div.className = 'msg ' + cls;

  const time = ts ? new Date(ts).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) : '';

  const nameEl = document.createElement('span');
  nameEl.className = 'name';
  nameEl.textContent = name;

  const textNode = document.createTextNode(text);

  const timeEl = document.createElement('span');
  timeEl.className = 'time';
  timeEl.textContent = time;

  div.appendChild(nameEl);
  div.appendChild(textNode);
  div.appendChild(timeEl);
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

/* ============================================================
   BİLDİRİM SİSTEMİ (FCM + Web Notification)
   ============================================================ */
async function initNotifications() {
  if (!("Notification" in window)) {
    updateNotifBtn();
    return;
  }

  if (Notification.permission === "granted") {
    notifEnabled = true;
    updateNotifBtn();
    await setupFCM();
  } else if (Notification.permission === "default") {
    // Otomatik sorma, kullanıcı butona bassın
    updateNotifBtn();
  } else {
    notifEnabled = false;
    updateNotifBtn();
  }
}

async function toggleNotifications() {
  if (!("Notification" in window)) {
    alert("Bu cihaz bildirim desteklemiyor.");
    return;
  }

  if (Notification.permission === "denied") {
    alert("Bildirimler engellenmiş.\n\nChrome: Adres çubuğundaki kilit ikonu → Bildirimler → İzin Ver");
    return;
  }

  if (notifEnabled) {
    notifEnabled = false;
    updateNotifBtn();
    showToast("🔕 Bildirimler kapatıldı");
    return;
  }

  try {
    const perm = await Notification.requestPermission();
    notifEnabled = (perm === "granted");
    updateNotifBtn();
    if (notifEnabled) {
      showToast("🔔 Bildirimler açıldı!");
      await setupFCM();
    } else {
      showToast("❌ İzin verilmedi");
    }
  } catch (e) {
    alert("İzin alınamadı: " + e.message);
  }
}

function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  if (notifEnabled) {
    btn.classList.add('active');
    btn.textContent = '🔔';
  } else {
    btn.classList.remove('active');
    btn.textContent = '🔕';
  }
}

/* ---------- FCM TOKEN AL ---------- */
async function setupFCM() {
  if (!messaging) return;
  try {
    // Service worker'ı kaydet
    const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');

    const token = await messaging.getToken({
      vapidKey: VAPID_KEY,
      serviceWorkerRegistration: registration
    });

    if (token) {
      fcmToken = token;
      console.log("FCM Token:", token);

      // Token'ı Firebase'e kaydet (bu odaya ait)
      db.ref("rooms/" + roomId + "/tokens/" + userId).set({
        token: token,
        name: userName,
        ts: Date.now()
      });

      // Bağlantı kesildiğinde token'ı sil
      db.ref("rooms/" + roomId + "/tokens/" + userId).onDisconnect().remove();
    }
  } catch (e) {
    console.warn("FCM token alınamadı:", e);
  }
}

/* ---------- MESAJ GELİNCE BİLDİRİM ---------- */
function notifyNewMessage(from, text) {
  if (appVisible) {
    showToast("💬 " + from + ": " + (text.length > 40 ? text.substr(0, 40) + "..." : text));
  }

  if (!appVisible) {
    document.title = "💬 " + from + " yazdı - Sohbet";
  }

  // Foreground bildirim (FCM arka planda zaten gösterir)
  if (!notifEnabled || Notification.permission !== "granted") return;
  if (appVisible) {
    // Sayfa açıkken FCM zaten bildirim göstermiyor, manuel göster
    try {
      const n = new Notification("Sohbet - " + from, {
        body: text.length > 80 ? text.substr(0, 80) + "..." : text,
        tag: "sohbet-" + Date.now(),
        silent: false
      });
      n.onclick = function() { window.focus(); n.close(); };
      setTimeout(() => n.close(), 5000);
    } catch (e) {
      console.warn("Foreground bildirim:", e);
    }
  }
}

/* ---------- TOAST ---------- */
let toastTimer = null;
function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ---------- DURUM ---------- */
function showConnStatus(text) {
  const el = document.getElementById('connStatus');
  el.textContent = text;
  el.classList.add('show');
}
function hideConnStatus() {
  document.getElementById('connStatus').classList.remove('show');
}
function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loading').classList.add('hidden'); }

/* ---------- ENTER TUŞLARI ---------- */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); sendMsg(); }
  });
  document.getElementById('nameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('roomInput').focus();
  });
  document.getElementById('roomInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
});

window.addEventListener('beforeunload', () => {
  if (chatRef) chatRef.off();
  if (typingRef) typingRef.off();
});

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const box = document.getElementById('chatMessages');
    if (box) box.scrollTop = box.scrollHeight;
  });
}
</script>
</body>
</html>
